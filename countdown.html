<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Countdown to our wedding</title><style>html,body{height:100%;margin:0;background:transparent;color:#274872}body{display:flex;align-items:center;justify-content:center;font-family:Georgia,serif}#clock{display:flex;justify-content:center;gap:clamp(10px,4vw,40px);text-align:center}.n{display:block;font-size:clamp(24px,6vw,58px);font-variant-numeric:tabular-nums}.u{display:block;font-size:clamp(9px,2vw,17px);text-transform:uppercase;letter-spacing:.12em;margin-top:8px}</style></head><body><div id="clock" aria-label="Countdown to November 27, 2026 at 1 PM Philippine time"></div><script>const date=new Date('2026-11-27T13:00:00+08:00').getTime();function tick(){let s=Math.max(0,Math.floor((date-Date.now())/1000));const v=[Math.floor(s/86400),Math.floor(s%86400/3600),Math.floor(s%3600/60),s%60];document.getElementById('clock').innerHTML=v.map((n,i)=>'<span><span class="n">'+String(n).padStart(2,'0')+'</span><span class="u">'+['Days','Hours','Minutes','Seconds'][i]+'</span></span>').join('')}tick();setInterval(tick,1000);</script></body></html>
